# .github/workflows/preview.yml
name: Preview

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request number"
        required: false
        type: number
      pr_head_ref:
        description: "Head branch name for the PR"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.pr_head_ref || github.head_ref || github.ref_name || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build

      - name: Get PR number
        id: pr
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PR_HEAD_REF: ${{ inputs.pr_head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_PR_NUMBER" ]; then
            echo "number=$INPUT_PR_NUMBER" >> $GITHUB_OUTPUT
            exit 0
          fi
          BRANCH_NAME=${INPUT_PR_HEAD_REF:-${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}}
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number' || echo "")
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Version packages for preview
        if: steps.pr.outputs.number != ''
        run: |
          pnpm -r exec npm version prerelease --preid=pr${{ steps.pr.outputs.number }} --no-git-tag-version

      - name: Publish preview to npm
        if: steps.pr.outputs.number != ''
        run: pnpm -r publish --tag pr${{ steps.pr.outputs.number }} --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Comment preview info
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🚀 Preview packages published with tag \`pr${prNumber}\`\n\nInstall with: \`pnpm add @your-org/package@pr${prNumber}\``
            });