# .github/workflows/preview.yml
name: Preview

on:
  workflow_run:
    workflows: ["Format"]
    types: [completed]

jobs:
  preview:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build

      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(gh pr view --json number -q .number || echo "")
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version packages for preview
        if: steps.pr.outputs.number != ''
        run: |
          pnpm -r exec npm version prerelease --preid=pr${{ steps.pr.outputs.number }} --no-git-tag-version

      - name: Publish preview to npm
        if: steps.pr.outputs.number != ''
        run: pnpm -r publish --tag pr${{ steps.pr.outputs.number }} --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Comment preview info
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🚀 Preview packages published with tag \`pr${prNumber}\`\n\nInstall with: \`pnpm add @your-org/package@pr${prNumber}\``
            });